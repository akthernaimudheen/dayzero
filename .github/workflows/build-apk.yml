name: Build Shareable Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Prune Incompatible Native Modules
        run: |
          rm -rf node_modules/expo-constants app/node_modules/expo-constants
          rm -rf node_modules/expo-linking app/node_modules/expo-linking
          rm -rf node_modules/expo-status-bar app/node_modules/expo-status-bar

      - name: Build Shared Logic
        run: npm run build:shared

      - name: Patch Expo Gradle Compatibility
        run: node scripts/patch_expo_gradle.mjs

      - name: Build Standalone Release APK with Gradle
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Shareable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayZero-preview-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
